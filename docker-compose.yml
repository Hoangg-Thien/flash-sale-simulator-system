include:
  - docker-compose.inventory.yml

services:
  order-postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USERNAME:-orders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orders}
    volumes:
      - order_data:/var/lib/postgresql/data
    networks: [order-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d order_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  order-service:
    image: flash-sale-order:local
    build:
      context: .
      args:
        SERVICE: order-service
    ports:
      - "127.0.0.1:${ORDER_PORT:-8080}:8080"
    networks: [order-db, default]
    environment:
      SPRING_PROFILES_ACTIVE: ${ORDER_PROFILES:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-orders}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-orders}
      INVENTORY_BASE_URLS: http://inventory-a:8081,http://inventory-b:8081
      INVENTORY_LOCK_MODE: ${INVENTORY_LOCK_MODE:-ATOMIC}
    depends_on:
      order-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  order-db:
    internal: true

volumes:
  order_data:
