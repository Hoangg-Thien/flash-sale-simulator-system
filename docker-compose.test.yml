# Chạy trong CI để test với real services (không dùng Testcontainers)
# Dùng: docker compose -f docker-compose.test.yml up -d
# Sau đó: mvn test -Dspring.profiles.active=ci

services:
  postgres-test:
    image: postgres:17.9
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5436:5432"
    tmpfs:
      - /var/lib/postgresql/data     # In-memory storage → nhanh hơn volume

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
