# PostgreSQL và Redis tạm thời để thử nghiệm thủ công trên máy cục bộ.
# Maven và CI khởi động các dependency kiểm thử bằng Testcontainers.
# docker compose -f docker-compose.test.yml up -d
# docker compose -f docker-compose.test.yml down

services:
  postgres-test:
    image: postgres:17.9
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5436:5432"
    tmpfs:
      - /var/lib/postgresql/data     # In-memory storage → nhanh hơn volume

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
