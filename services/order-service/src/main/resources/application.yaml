spring:
  application:
    name: flash-sale

  task:
    scheduling:
      pool:
        size: 2

  jackson:
    deserialization:
      accept-float-as-int: false

  datasource:
    url: jdbc:postgresql://localhost:5435/order_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  instance-id: ${INSTANCE_ID:local}

logging:
  pattern:
    level: "%5p [instanceId=%X{instanceId:-${app.instance-id}}] [requestId=%X{requestId:-}]"
