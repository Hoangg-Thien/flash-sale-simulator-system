# Profile kích hoạt khi SPRING_PROFILES_ACTIVE=docker
# Override các giá trị cần thiết cho Docker environment

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/flashsale
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    show-sql: false # tắt SQL log trong production

  data:
    redis:
      host: redis
      port: 6379
