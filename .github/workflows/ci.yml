name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test-and-build:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run Unit and Integration Tests (Testcontainers)
        run: ./mvnw clean test

      - name: Build Application Jar
        run: ./mvnw package -DskipTests

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            services/*/target/surefire-reports/
            services/inventory-service/target/inventory-integration/
          retention-days: 7
