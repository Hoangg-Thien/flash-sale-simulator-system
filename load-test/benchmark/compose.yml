name: flashsale-k6-evidence
x-pg: &pg
  image: postgres:17.9
  environment: {POSTGRES_DB: bench, POSTGRES_USER: bench, POSTGRES_PASSWORD: bench}
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bench", "-d", "bench"]
    interval: 2s
    timeout: 2s
    retries: 30
x-redis: &redis
  image: redis:7-alpine
  cpus: 0.5
  mem_limit: 128m
x-jvm: &jvm
  LOGGING_LEVEL_ROOT: WARN
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_DATASOURCE_USERNAME: bench
  SPRING_DATASOURCE_PASSWORD: bench
x-app: &app
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
    interval: 2s
    timeout: 2s
    retries: 50
x-mono: &mono
  <<: *app
  image: flashsale-bench-monolith:3ae96ef
  cpus: 1.5
  mem_limit: 768m
  environment:
    <<: *jvm
    SPRING_DATASOURCE_URL: jdbc:postgresql://mono-db:5432/bench
    SPRING_DATA_REDIS_HOST: mono-redis
    REDIS_HOST: mono-redis
  depends_on:
    mono-db: {condition: service_healthy}
    mono-redis: {condition: service_started}
x-inventory: &inventory
  <<: *app
  image: flashsale-bench-inventory:working
  cpus: 1
  mem_limit: 512m
  environment:
    <<: *jvm
    SERVER_PORT: 8080
    SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/bench
    INVENTORY_REDIS_ADDRESS: redis://dist-redis:6379
    INVENTORY_LOCK_MODE: ${MODE:-ATOMIC}
  depends_on:
    inventory-db: {condition: service_healthy}
    dist-redis: {condition: service_started}
services:
  mono-db: {<<: *pg, cpus: 2, mem_limit: 1024m}
  order-db: {<<: *pg, cpus: 1, mem_limit: 512m}
  inventory-db: {<<: *pg, cpus: 1, mem_limit: 512m}
  mono-redis: *redis
  dist-redis: *redis
  mono-a: {<<: *mono}
  mono-b: {<<: *mono}
  inventory-a: *inventory
  inventory-b: *inventory
  order:
    <<: *app
    image: flashsale-bench-order:working
    cpus: 1
    mem_limit: 512m
    environment:
      <<: *jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/bench
      INVENTORY_BASE_URLS: http://inventory-a:8080,http://inventory-b:8080
      INVENTORY_LOCK_MODE: ${MODE:-ATOMIC}
    depends_on:
      order-db: {condition: service_healthy}
