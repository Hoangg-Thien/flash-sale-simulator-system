# Isolated benchmark ports; requires Docker Compose >= 2.24.4.
services:
  postgres:
    ports: !reset []
    cpus: 2
    mem_limit: 1g
  redis:
    ports: !reset []
    cpus: 1
    mem_limit: 256m
  app-a:
    ports: !override ["127.0.0.1:18080:8080"]
    cpus: 2
    mem_limit: 1g
    environment:
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
  app-b:
    ports: !override ["127.0.0.1:18081:8080"]
    cpus: 2
    mem_limit: 1g
    environment:
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
